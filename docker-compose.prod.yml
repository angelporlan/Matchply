version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nextprof_postgres_prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nextprof_secure_pwd
      POSTGRES_DB: nextprof_db
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=100
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: web
    container_name: nextprof_web_prod
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:nextprof_secure_pwd@db:5432/nextprof_db
      - NODE_ENV=production
      - DATABASE_POOL_MAX=8
      - DATABASE_STATEMENT_TIMEOUT_MS=15000
      - NODE_OPTIONS=--max-old-space-size=768
      - PDF_WORKER_POOL_SIZE=2
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 1g
    restart: always

  research_worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: worker
    container_name: nextprof_research_worker_prod
    command: npm run research:worker
    environment:
      - DATABASE_URL=postgresql://postgres:nextprof_secure_pwd@db:5432/nextprof_db
      - NODE_ENV=production
      - DATABASE_POOL_MAX=8
      - DATABASE_STATEMENT_TIMEOUT_MS=180000
      - NODE_OPTIONS=--max-old-space-size=384
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    restart: always

  ai_worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: worker
    container_name: nextprof_ai_worker_prod
    command: npm run ai:worker
    environment:
      - DATABASE_URL=postgresql://postgres:nextprof_secure_pwd@db:5432/nextprof_db
      - NODE_ENV=production
      - DATABASE_POOL_MAX=8
      - DATABASE_STATEMENT_TIMEOUT_MS=180000
      - AI_WORKER_ENABLED=true
      - AI_GLOBAL_CONCURRENCY=2
      - NODE_OPTIONS=--max-old-space-size=512
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m
    restart: always

volumes:
  postgres_prod_data:
