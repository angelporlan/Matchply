name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: matchply-production
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  images:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      web: ${{ steps.web.outputs.digest }}
      worker: ${{ steps.worker.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish web
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.prod
          target: web
          push: true
          platforms: linux/amd64
          tags: ghcr.io/angelporlan/matchply-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/angelporlan/Matchply
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=matchply
          cache-to: type=gha,scope=matchply,mode=max
      - name: Build and publish workers
        id: worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.prod
          target: worker
          push: true
          platforms: linux/amd64
          tags: ghcr.io/angelporlan/matchply-worker:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/angelporlan/Matchply
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=matchply
  deploy:
    # Manual runs on testing build rehearsal images only.
    if: github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure verified SSH identity
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/matchply_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/matchply_deploy ~/.ssh/known_hosts
      - name: Deploy the checked commit
        env:
          RELEASE_SHA: ${{ github.sha }}
          WEB_DIGEST: ${{ needs.images.outputs.web }}
          WORKER_DIGEST: ${{ needs.images.outputs.worker }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          node scripts/deploy/release-payload.mjs | ssh \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=12 \
            -i ~/.ssh/matchply_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" deploy
      - name: Deployment summary
        if: always()
        env:
          RELEASE_SHA: ${{ github.sha }}
          RESULT: ${{ job.status }}
        run: printf 'Commit `%s` — deployment **%s**.\n' "$RELEASE_SHA" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove ephemeral key
        if: always()
        run: rm -f ~/.ssh/matchply_deploy
