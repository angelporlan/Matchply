name: CI
on:
  push:
    branches: [testing]
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: matchply_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci_only@127.0.0.1:5432/matchply_test
      MATCH_BATCH_TEST_DATABASE_URL: postgresql://postgres:ci_only@127.0.0.1:5432/matchply_test
      NEXTAUTH_SECRET: ci-build-placeholder-not-a-production-secret
      NEXTAUTH_URL: http://localhost:3000
      STRIPE_TEST_SECRET_KEY: sk_test_ci_placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run db:migrate
      - name: Migration idempotency and history
        run: |
          npm run db:migrate
          node scripts/deploy/migration-check.mjs
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m unittest discover -s scripts/deploy -p '*_test.py'
      - run: npm run build
